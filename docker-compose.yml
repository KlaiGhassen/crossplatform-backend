version: '3.8'

services:
  app:
    build: .
    container_name: movie_app_backend
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:latest
    container_name: movie_app_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
  uploads_data: